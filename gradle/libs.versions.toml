[versions]
minecraft = "26.1.2"
paper = "26.1.2.build.+"
mockbukkit = "4.115.0"
junit = "6.1.3"
retrohue = "0.2.0"
asynccraftr = "0.2.0"
exposed = "1.6.0"
sqlite = "3.49.1.0"
kotlin = "2.3.20"
shadow = "9.3.0"

[plugins]
# The Kotlin plugin version doubles as the version of the Kotlin standard library that the
# plugin loader hands to the server, so both are driven by the `kotlin` version above.
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
shadow = { id = "com.gradleup.shadow", version.ref = "shadow" }

[libraries]
paper-api = { module = "io.papermc.paper:paper-api", version.ref = "paper" }
# NOTE: The version suffix must stay in sync with `minecraft` above. Build fails if the two
# versions aren't the same.
mockbukkit = { module = "org.mockbukkit.mockbukkit:mockbukkit-v26.1.2", version.ref = "mockbukkit" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
retrohue = { module = "org.winlogon:retrohue", version.ref = "retrohue" }
asynccraftr = { module = "org.winlogon:asynccraftr", version.ref = "asynccraftr" }
kotlin-stdlib = { module = "org.jetbrains.kotlin:kotlin-stdlib", version.ref = "kotlin" }
exposed-core = { module = "org.jetbrains.exposed:exposed-core", version.ref = "exposed" }
exposed-dao = { module = "org.jetbrains.exposed:exposed-dao", version.ref = "exposed" }
exposed-jdbc = { module = "org.jetbrains.exposed:exposed-jdbc", version.ref = "exposed" }
sqlite-jdbc = { module = "org.xerial:sqlite-jdbc", version.ref = "sqlite" }
